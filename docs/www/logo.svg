<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!--
    Логотип «Огнелисс»: пламя, из которого вырезан силуэт лисы.

    Второе ухо — вырез маской, а не фигура цвета фона. Лиса нарисована
    пустотой в пламени, и ухо должно быть той же пустотой: тогда логотип
    правильно выглядит на любом фоне — тёмном, светлом, на вкладке
    браузера. Фигура «цвета фона» совпала бы только с одним фоном.
  -->
