# ═══════════════════════════════════════════════════════════════════════
# Ogneliss Dialer — статический сервер документов
# ═══════════════════════════════════════════════════════════════════════
#
# Отдаёт юридические документы, к которым Nginx Proxy Manager
# проксирует запросы с ogneliss.ru/dialer.
#
# ── Почему отдельный контейнер, а не файлы внутрь NPM ──────────────────
# NPM обновляется, и его том с данными при обновлении может быть
# пересоздан. Файлы, положенные туда вручную, тогда пропадут — причём
# незаметно, и Google Play увидит битую ссылку на политику.
#
# Отдельный контейнер живёт своей жизнью: NPM про него знает только
# адрес, а обновление одного не задевает другой.
#
# ── Запуск ─────────────────────────────────────────────────────────────
#   docker compose up -d
#
# Проверка изнутри сети docker:
#   docker exec -it nginx-proxy-manager curl -I http://ogneliss-docs/dialer/privacy
# ═══════════════════════════════════════════════════════════════════════

services:
  ogneliss-docs:
    image: nginx:alpine
    container_name: ogneliss-docs
    restart: unless-stopped

    volumes:
      # Страницы: собираются скриптом build-pages.sh
      - ./site:/usr/share/nginx/html:ro
      # Своя конфигурация: адреса без расширения задаются здесь
      - ./nginx-docs.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      # ВАЖНО: та же сеть, что у Nginx Proxy Manager.
      # Без неё NPM не сможет достучаться до контейнера по имени,
      # и придётся пробрасывать порт наружу — лишняя открытая дверь
      - npm-network

    # Порт наружу НЕ публикуется намеренно: контейнер доступен только
    # из сети docker, а снаружи — исключительно через NPM с его
    # сертификатом. Так документы нельзя открыть по HTTP в обход HTTPS

networks:
  npm-network:
    # Имя сети, в которой работает ваш NPM.
    # Посмотреть: docker inspect nginx-proxy-manager | grep -A 5 Networks
    # Если сеть называется иначе — поправьте здесь
    name: npm-network
    external: true
