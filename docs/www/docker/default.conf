server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Главная страница /dialer → index.html
    location = /dialer {
        try_files /index.html =404;
    }

    # Все запросы /dialer/* → ищем файл с .html
    location /dialer/ {
        rewrite ^/dialer/(.*)$ /$1 break;
        try_files $uri.html $uri /index.html;
    }

    # Все остальные запросы → ищем файл или отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
