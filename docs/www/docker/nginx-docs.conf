# Конфигурация статического сервера документов.
#
# Работает за Nginx Proxy Manager: сертификаты, HTTPS и домен —
# его забота. Здесь только раздача файлов по внутренней сети docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Адреса без расширения ──────────────────────────────────────────
    #
    # /dialer/privacy, а не /dialer/privacy.html.
    #
    # Адрес попадает в консоль Google Play и в текст EULA внутри
    # установленного приложения. Менять его после публикации нельзя:
    # у пользователей старых версий останется ссылка на прежний путь.
    #
    # Расширение или версия в пути связали бы вас на годы вперёд.
    location = /dialer/privacy {
        try_files /dialer/privacy.html =404;
    }

    location = /dialer/eula {
        try_files /dialer/eula.html =404;
    }

    location = /dialer/terms {
        try_files /dialer/terms.html =404;
    }

    location = /dialer/licenses {
        try_files /dialer/licenses.html =404;
    }

    location = /dialer {
        return 301 /dialer/;
    }

    location /dialer/ {
        try_files $uri $uri/ /dialer/index.html;
    }

    # ── Кэширование ────────────────────────────────────────────────────
    #
    # Документы на час: при смене редакции посетитель не должен неделю
    # видеть старую. Часа хватает, чтобы снять нагрузку от повторных
    # заходов, а обновление доходит быстро.
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css text/plain;
    gzip_min_length 1024;

    # Скрытые файлы недоступны
    location ~ /\. {
        deny all;
        return 404;
    }
}
