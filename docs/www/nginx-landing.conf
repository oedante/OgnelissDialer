# ═══════════════════════════════════════════════════════════════════════
# ДЛЯ NGINX PROXY MANAGER — этот файл и используется.
# Вставить целиком в хост ogneliss.ru → Edit → Advanced → Custom Nginx
# Configuration. Страницы отдаёт контейнер статики (dialer-static), в него
# кладётся содержимое каталога site/ как есть (страницы собирает
# site/build_site.py; языковые каталоги ru/ de/ fr/ — вместе с остальным).
#
# nginx-ogneliss.conf рядом — НЕ для NPM: это вариант для сервера с обычным
# nginx без NPM (свой server{}, сертификат certbot). Одновременно оба
# не нужны; при NPM второй файл просто не используется.
# ═══════════════════════════════════════════════════════════════════════

# ── Контейнер статики — по имени через DNS Docker, при запросе ──────────
# Раньше имя dialer-static было записано прямо в proxy_pass, и nginx
# проверял его при запуске: стоило контейнеру статики не подняться после
# перезагрузки — nginx в NPM не стартовал совсем, и вместе с сайтом
# переставали открываться вход в почту (/oauth) и всё остальное
# («host not found in upstream "dialer-static"», 09.10.2026). Теперь имя
# ищется при каждом запросе: без контейнера статики — 502 только на этих
# страницах, остальной NPM работает. 127.0.0.11 — DNS Docker в сети NPM.
resolver 127.0.0.11 valid=30s ipv6=off;
set $docs dialer-static;

# ── Язык посетителя (20.10.2026) ────────────────────────────────────────
# Основные страницы — английские, на прежних адресах (они вписаны в
# приложения и консоли Google и Apple). Раньше язык не определялся вовсе:
# со ссылки из поиска или из приложения все попадали на английскую страницу.
# Теперь посетитель, который ПРИШЁЛ СО СТОРОНЫ (поиск, ссылка из приложения
# или письма, набранный адрес), а браузер у него просит русский, немецкий
# или французский, переадресуется на страницу своего языка (302).
# Не переадресуются:
#   · переходы внутри сайта (Referer — ogneliss.ru): нажали «EN» — остаётесь
#     на английской странице;
#   · поисковые и проверяющие роботы (Google, Яндекс, Bing…) и curl/wget —
#     им нужен каждый язык по своему адресу (hreflang), проверке бренда
#     Google — английская страница;
#   · адрес с ?lang=en — английская версия явно (например, для проверяющих).
# Без cookie и без скриптов: страницы, как и раньше, — чистый HTML.
# Порядок важен: сначала русский как любой язык списка у тех, у кого первым
# стоит не английский, немецкий или французский («uk, ru;q=0.9» → русский),
# затем немецкий и французский, если они первые; затем исключения.
set $ogn_lang "";
if ($http_accept_language ~* "^(?!\s*(en|de|fr))(?:.*[,;\s])?ru(?:[-_;,\s]|$)") { set $ogn_lang ru; }
if ($http_accept_language ~* "^\s*de") { set $ogn_lang de; }
if ($http_accept_language ~* "^\s*fr") { set $ogn_lang fr; }
if ($http_referer ~* "^https?://(www\.)?ogneliss\.ru(/|$)") { set $ogn_lang ""; }
if ($http_user_agent ~* "bot|crawl|spider|slurp|google|yandex|bing|baidu|duckduck|facebookexternalhit|preview|lighthouse|curl|wget|python") { set $ogn_lang ""; }
if ($arg_lang = "en") { set $ogn_lang ""; }

# Подтверждение издателя Microsoft (Entra → Branding → Publisher domain).
# Файл лежит в корне статики рядом со страницами Dialer.
location = /.well-known/microsoft-identity-association.json {
    proxy_pass http://$docs/microsoft-identity-association.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# Ogneliss Dialer — явные правила для каждой страницы
# ============================================

# Редирект
location = /dialer {
    return 301 /dialer/;
}

# Главная
location = /dialer/ {
    if ($ogn_lang) { return 302 /dialer/$ogn_lang/; }
    proxy_pass http://$docs/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Страницы документов — без .html в URL
# Язык посетителя — см. «Язык посетителя» в начале файла (#delete и другие
# якоря браузер сохраняет при переадресации сам).
location = /dialer/privacy  { if ($ogn_lang) { return 302 /dialer/$ogn_lang/privacy; }  proxy_pass http://$docs/privacy.html;  proxy_set_header Host $host; }
location = /dialer/eula     { if ($ogn_lang) { return 302 /dialer/$ogn_lang/eula; }     proxy_pass http://$docs/eula.html;     proxy_set_header Host $host; }
location = /dialer/terms    { if ($ogn_lang) { return 302 /dialer/$ogn_lang/terms; }    proxy_pass http://$docs/terms.html;    proxy_set_header Host $host; }
location = /dialer/licenses { if ($ogn_lang) { return 302 /dialer/$ogn_lang/licenses; } proxy_pass http://$docs/licenses.html; proxy_set_header Host $host; }
# Вопросы и ответы (23.10.2026). Без этого правила адрес ушёл бы в «location /dialer/»
# ниже, и статика искала бы файл «faq» без расширения — 404
location = /dialer/faq      { if ($ogn_lang) { return 302 /dialer/$ogn_lang/faq; }      proxy_pass http://$docs/faq.html;      proxy_set_header Host $host; }

# ✅ ВСЯ СТАТИКА (css, js, svg, png) — одним правилом
location /dialer/ {
    rewrite ^/dialer/(.*)$ /$1 break;
    proxy_pass http://$docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# Ogneliss Mail — те же правила, файлы в подкаталоге mail/
# ============================================
#
# Страницы Mail лежат на статическом сервере в mail/ рядом со страницами
# Dialer. Страницы собирает site/build_site.py (стили внутри страниц, без
# скриптов); значки берутся из /dialer/ и /mail/.
#
# Адреса без .html и без версии: /mail/privacy указывается в консоли
# Google Play и в самом приложении, менять его потом нельзя.

location = /mail {
    return 301 /mail/;
}

location = /mail/ {
    if ($ogn_lang) { return 302 /mail/$ogn_lang/; }
    proxy_pass http://$docs/mail/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /mail/privacy  { if ($ogn_lang) { return 302 /mail/$ogn_lang/privacy; }  proxy_pass http://$docs/mail/privacy.html;  proxy_set_header Host $host; }
location = /mail/eula     { if ($ogn_lang) { return 302 /mail/$ogn_lang/eula; }     proxy_pass http://$docs/mail/eula.html;     proxy_set_header Host $host; }
location = /mail/terms    { if ($ogn_lang) { return 302 /mail/$ogn_lang/terms; }    proxy_pass http://$docs/mail/terms.html;    proxy_set_header Host $host; }
location = /mail/licenses { if ($ogn_lang) { return 302 /mail/$ogn_lang/licenses; } proxy_pass http://$docs/mail/licenses.html; proxy_set_header Host $host; }

# Английские страницы для проверки Google OAuth (каталоги en/ и en/privacy/
# с index.html; их отдаёт правило «location /mail/» ниже). Адреса без слеша
# переадресуются здесь: иначе переадресацию делал бы контейнер статики —
# со своим внутренним адресом в Location.
location = /mail/en         { return 301 /mail/en/; }
location = /mail/en/privacy { return 301 /mail/en/privacy/; }
# Условия, EULA и лицензии по адресам /mail/en/… ведут на основные
# (английские) страницы: /mail/en/terms давал 404 (аудит 10.10.2026).
location = /mail/en/terms    { return 301 /mail/terms; }
location = /mail/en/eula     { return 301 /mail/eula; }
location = /mail/en/licenses { return 301 /mail/licenses; }

# Значок приложения и прочая статика Mail
location /mail/ {
    proxy_pass http://$docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# Ogneliss NumTouch — программа для компьютеров (с 19.10.2026)
# ============================================
#
# Одна страница на язык, без документов (код и лицензия — на GitHub).
# Файлы: numtouch/index.html и значки в numtouch/, языки — <l>/numtouch/index.html.

location = /numtouch {
    return 301 /numtouch/;
}

location = /numtouch/ {
    if ($ogn_lang) { return 302 /numtouch/$ogn_lang/; }
    proxy_pass http://$docs/numtouch/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Значки NumTouch
location /numtouch/ {
    proxy_pass http://$docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/numtouch/(ru|de|fr)$        { return 301 /numtouch/$1/; }
location ~ ^/numtouch/(ru|de|fr)/$       { proxy_pass http://$docs/$1/numtouch/index.html; proxy_set_header Host $host; }

# ============================================
# Другие языки (ru, de, fr) — сайт 11.10.2026
# ============================================
#
# Английский — основной язык, адреса без языка (как выше). Русская, немецкая
# и французская редакции — отдельные страницы, без скриптов:
#   /ru/                  → ru/home.html
#   /dialer/ru/<doc>      → ru/<doc>.html        (/dialer/ru/ → ru/index.html)
#   /mail/ru/<doc>        → ru/mail/<doc>.html   (/mail/ru/  → ru/mail/index.html)
# Каталог языка в статике повторяет устройство корня. Регулярные правила
# сильнее «location /dialer/», «location /mail/» и «location /», поэтому
# порядок в файле не важен; точные правила «=» выше их не задевают.
location ~ ^/(ru|de|fr)$                 { return 301 /$1/; }
location ~ ^/(ru|de|fr)/$                { proxy_pass http://$docs/$1/home.html; proxy_set_header Host $host; }
location ~ ^/dialer/(ru|de|fr)$          { return 301 /dialer/$1/; }
location ~ ^/dialer/(ru|de|fr)/$         { proxy_pass http://$docs/$1/index.html; proxy_set_header Host $host; }
location ~ ^/dialer/(ru|de|fr)/(privacy|terms|eula|licenses|faq)$ { proxy_pass http://$docs/$1/$2.html; proxy_set_header Host $host; }
location ~ ^/mail/(ru|de|fr)$            { return 301 /mail/$1/; }
location ~ ^/mail/(ru|de|fr)/$           { proxy_pass http://$docs/$1/mail/index.html; proxy_set_header Host $host; }
location ~ ^/mail/(ru|de|fr)/(privacy|terms|eula|licenses)$ { proxy_pass http://$docs/$1/mail/$2.html; proxy_set_header Host $host; }

# ============================================
# Главная ogneliss.ru — витрина приложений
# ============================================
#
# ══════════════════════════════════════════════════════════════════════
# ПОЧЕМУ ФАЙЛ, А НЕ СТРАНИЦА ВНУТРИ return 200 '...'
# ══════════════════════════════════════════════════════════════════════
# У nginx предел длины одного параметра — около 4 КБ. Прежняя страница
# в него укладывалась, новая — с карточками приложений — нет: nginx
# отказывается загружать конфигурацию («too long parameter»).
# Проверено настоящим nginx -t, а не на глаз.
#
# Поэтому страница лежит файлом home.html рядом со страницами Dialer
# и отдаётся тем же статическим сервером. Заодно её можно править,
# не трогая конфигурацию nginx.

# Для поисковиков: правила обхода и карта сайта — по стандартным
# адресам в корне, файлы лежат рядом со страницами Dialer
location = /robots.txt  { proxy_pass http://$docs/robots.txt;  proxy_set_header Host $host; }
location = /sitemap.xml { proxy_pass http://$docs/sitemap.xml; proxy_set_header Host $host; }
# Значок сайта по стандартному адресу: его запрашивают браузеры и Яндекс
# для значка в выдаче. Без правила запрос уходил в «любой адрес → /»
location = /favicon.ico { proxy_pass http://$docs/favicon-32.png; proxy_set_header Host $host; }

# Файлы подтверждения прав для Яндекс Вебмастера и Google Search Console
# (yandex_*.html, google*.html) — положить в docs/www рядом со страницами
location ~ ^/(yandex_[0-9a-f]+\.html|google[0-9a-f]+\.html)$ {
    proxy_pass http://$docs/$1;
    proxy_set_header Host $host;
}

location = / {
    if ($ogn_lang) { return 302 /$ogn_lang/; }
    proxy_pass http://$docs/home.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Прежде любой неизвестный адрес показывал главную. Так и осталось,
# но переадресацией: адресная строка покажет /, а не выдуманный путь
location / {
    return 302 /;
}
