# ============================================
# Ogneliss Dialer — явные правила для каждой страницы
# ============================================

# Редирект
location = /dialer {
    return 301 /dialer/;
}

# Главная
location = /dialer/ {
    proxy_pass http://dialer-static/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Страницы документов — без .html в URL
location = /dialer/privacy  { proxy_pass http://dialer-static/privacy.html;  proxy_set_header Host $host; }
location = /dialer/eula     { proxy_pass http://dialer-static/eula.html;     proxy_set_header Host $host; }
location = /dialer/terms    { proxy_pass http://dialer-static/terms.html;    proxy_set_header Host $host; }
location = /dialer/licenses { proxy_pass http://dialer-static/licenses.html; proxy_set_header Host $host; }

# ✅ ВСЯ СТАТИКА (css, js, svg, png) — одним правилом
location /dialer/ {
    proxy_pass http://dialer-static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# Ogneliss Mail — те же правила, файлы в подкаталоге mail/
# ============================================
#
# Страницы Mail лежат на статическом сервере в mail/ рядом со страницами
# Dialer (собирает build-pages.sh). Общие стили, переключатель языка
# и значки берутся из /dialer/ — второй копии нет.
#
# Адреса без .html и без версии: /mail/privacy указывается в консоли
# Google Play и в самом приложении, менять его потом нельзя.

location = /mail {
    return 301 /mail/;
}

location = /mail/ {
    proxy_pass http://dialer-static/mail/index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /mail/privacy  { proxy_pass http://dialer-static/mail/privacy.html;  proxy_set_header Host $host; }
location = /mail/eula     { proxy_pass http://dialer-static/mail/eula.html;     proxy_set_header Host $host; }
location = /mail/terms    { proxy_pass http://dialer-static/mail/terms.html;    proxy_set_header Host $host; }
location = /mail/licenses { proxy_pass http://dialer-static/mail/licenses.html; proxy_set_header Host $host; }

# Значок приложения и прочая статика Mail
location /mail/ {
    proxy_pass http://dialer-static/mail/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# Главная ogneliss.ru — витрина приложений
# ============================================
#
# ══════════════════════════════════════════════════════════════════════
# ПОЧЕМУ ФАЙЛ, А НЕ СТРАНИЦА ВНУТРИ return 200 '...'
# ══════════════════════════════════════════════════════════════════════
# У nginx предел длины одного параметра — около 4 КБ. Прежняя страница
# в него укладывалась, новая — с карточками приложений — нет: nginx
# отказывается загружать конфигурацию («too long parameter»).
# Проверено настоящим nginx -t, а не на глаз.
#
# Поэтому страница лежит файлом home.html рядом со страницами Dialer
# и отдаётся тем же статическим сервером. Заодно её можно править,
# не трогая конфигурацию nginx.

# Для поисковиков: правила обхода и карта сайта — по стандартным
# адресам в корне, файлы лежат рядом со страницами Dialer
location = /robots.txt  { proxy_pass http://dialer-static/robots.txt;  proxy_set_header Host $host; }
location = /sitemap.xml { proxy_pass http://dialer-static/sitemap.xml; proxy_set_header Host $host; }
# Значок сайта по стандартному адресу: его запрашивают браузеры и Яндекс
# для значка в выдаче. Без правила запрос уходил в «любой адрес → /»
location = /favicon.ico { proxy_pass http://dialer-static/favicon-32.png; proxy_set_header Host $host; }

# Файлы подтверждения прав для Яндекс Вебмастера и Google Search Console
# (yandex_*.html, google*.html) — положить в docs/www рядом со страницами
location ~ ^/(yandex_[0-9a-f]+\.html|google[0-9a-f]+\.html)$ {
    proxy_pass http://dialer-static/$1;
    proxy_set_header Host $host;
}

location = / {
    proxy_pass http://dialer-static/home.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Прежде любой неизвестный адрес показывал главную. Так и осталось,
# но переадресацией: адресная строка покажет /, а не выдуманный путь
location / {
    return 302 /;
}
