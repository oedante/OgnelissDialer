# ═══════════════════════════════════════════════════════════════════════
# Ogneliss Dialer — публикация юридических документов
# ═══════════════════════════════════════════════════════════════════════
#
# Google Play требует политику конфиденциальности по ПУБЛИЧНОМУ адресу
# и проверяет ссылку автоматически. Копии внутри приложения недостаточно.
#
# Разместить: /etc/nginx/sites-available/ogneliss.ru
# Включить:   ln -s /etc/nginx/sites-available/ogneliss.ru \
#                   /etc/nginx/sites-enabled/
# Проверить:  nginx -t && systemctl reload nginx
#
# ── Что нужно до первого запуска ───────────────────────────────────────
# 1. Сертификат: certbot --nginx -d ogneliss.ru -d www.ogneliss.ru
# 2. Файлы страниц в /var/www/ogneliss/dialer/ (см. build-pages.sh)
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name ogneliss.ru www.ogneliss.ru;

    # Проверка Let's Encrypt должна проходить по HTTP: до выпуска
    # сертификата HTTPS ещё нет, и перенаправление сломало бы выпуск
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ogneliss.ru www.ogneliss.ru;

    ssl_certificate     /etc/letsencrypt/live/ogneliss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogneliss.ru/privkey.pem;

    # Современные протоколы: TLS 1.0 и 1.1 отключены,
    # их браузеры уже помечают небезопасными
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ogneliss;
    index index.html;

    # ── Заголовки безопасности ─────────────────────────────────────────
    #
    # Страницы статические, без скриптов и внешних ресурсов, поэтому
    # политика максимально строгая: всё только со своего домена,
    # встраивание в чужие страницы запрещено.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Документы приложения ───────────────────────────────────────────
    #
    # Адреса без расширения: они попадают в консоль Google Play
    # и в текст самих документов, и менять их потом нельзя —
    # ссылка в опубликованном приложении останется старой.
    location = /dialer/privacy {
        default_type text/html;
        alias /var/www/ogneliss/dialer/privacy.html;
    }

    location = /dialer/eula {
        default_type text/html;
        alias /var/www/ogneliss/dialer/eula.html;
    }

    location = /dialer/terms {
        default_type text/html;
        alias /var/www/ogneliss/dialer/terms.html;
    }

    location = /dialer/licenses {
        default_type text/html;
        alias /var/www/ogneliss/dialer/licenses.html;
    }

    # Страница приложения
    location = /dialer {
        return 301 /dialer/;
    }

    location /dialer/ {
        try_files $uri $uri/ /dialer/index.html;
    }

    # ── Ogneliss Mail ──────────────────────────────────────────────────
    # Файлы лежат в dialer/mail/ (так их раскладывает build-pages.sh),
    # снаружи — по адресам /mail/…
    location = /mail/privacy  { default_type text/html; alias /var/www/ogneliss/dialer/mail/privacy.html; }
    location = /mail/eula     { default_type text/html; alias /var/www/ogneliss/dialer/mail/eula.html; }
    location = /mail/terms    { default_type text/html; alias /var/www/ogneliss/dialer/mail/terms.html; }
    location = /mail/licenses { default_type text/html; alias /var/www/ogneliss/dialer/mail/licenses.html; }
    location = /mail { return 301 /mail/; }
    location /mail/ {
        alias /var/www/ogneliss/dialer/mail/;
        index index.html;
    }

    # ── Кэширование ────────────────────────────────────────────────────
    #
    # Документы кэшируются на час, а не на сутки: при изменении редакции
    # посетитель не должен неделю видеть старую. Час достаточно,
    # чтобы снять нагрузку от повторных заходов.
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Сжатие: документы текстовые, выигрыш кратный
    gzip on;
    gzip_types text/html text/css text/plain;
    gzip_min_length 1024;

    # Скрытые файлы недоступны: .git, .env и подобное
    location ~ /\. {
        deny all;
        return 404;
    }
}
