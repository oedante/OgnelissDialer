# Автосборка и проверки на каждый коммит.
# Ловит регрессии до того, как они попадут в сборку для тестировщиков.
name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v5

      # Статические проверки: ловят ошибки компиляции за секунды,
      # не дожидаясь загрузки зависимостей и полной сборки
      - name: Проверки перед сборкой
        run: |
          python3 scripts/prebuild_check.py
          python3 scripts/audit.py

      - name: Статический анализ (Android Lint)
        run: ./gradlew lintDebug

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest

      # КРИТИЧЕСКАЯ ПРОВЕРКА ПРИВАТНОСТИ.
      # Любая новая зависимость может протащить разрешение INTERNET через
      # merged manifest. Всё обещание "данные не покидают устройство"
      # держится на его отсутствии, поэтому проверка ломает сборку.
      - name: Проверка отсутствия разрешения INTERNET
        run: |
          ./gradlew processDebugMainManifest
          MANIFEST=$(find app/build -name AndroidManifest.xml -path "*merged*" | head -1)
          echo "Проверяю $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::В merged manifest появилось разрешение INTERNET!"
            grep -n 'INTERNET' "$MANIFEST"
            exit 1
          fi
          echo "OK: разрешения INTERNET нет"

      # Модуль замеров собирается, но не запускается в CI:
      # Macrobenchmark требует реального устройства, на эмуляторе
      # его цифры не имеют смысла
      - name: Проверка компиляции модуля замеров
        run: ./gradlew :benchmark:assembleDebug || true

      # Флаг IN_CALL_SERVICE_RINGING без своего проигрывателя даёт
      # беззвучные входящие вызовы. На эмуляторе не обнаруживается
      - name: Проверка флага воспроизведения мелодии
        run: ./scripts/check_ringing_flag.sh

      - name: Сборка debug APK
        run: ./gradlew assembleDebug

      - name: Публикация артефакта
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
