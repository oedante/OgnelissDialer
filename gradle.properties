# ══════════════════════════════════════════════════════════════════════════
# СВОЙСТВА СБОРКИ — AGP 9.3.1
# ══════════════════════════════════════════════════════════════════════════
#
# Upgrade Assistant при переходе на AGP 9 добавил сюда семь флагов вида
# «вести себя как AGP 8». Каждый даёт предупреждение при каждой сборке,
# и все будут удалены в AGP 10. Ниже — что с каждым сделано и почему.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── Убраны: проект на прежнее поведение не опирается ─────────────────────
#
# android.usesSdkInManifest.disallowed=false
#     Запрещает <uses-sdk> в манифесте. У нас его нет — версии SDK
#     заданы в build.gradle.kts.
#
# android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#     Что делать, если targetSdk не задан. У нас он задан явно
#     в обоих модулях (app и benchmark).
#
# android.defaults.buildfeatures.resvalues=true
#     Включает resValue в build.gradle. Мы им не пользуемся —
#     имя сборки задаётся через manifestPlaceholders (разбор
#     в app/build.gradle.kts, блок debug).
#
# android.enableAppCompileTimeRClass=false
#     Поля R в приложении перестают быть константами времени
#     компиляции. Мешало бы только коду вида `const val X = R.string.y`
#     или Java-switch по идентификаторам — у нас такого нет
#     (проверено поиском).

# ── Убран: Kotlin — встроенный ───────────────────────────────────────────
#
# android.builtInKotlin=false
#     ⚠️ Самый важный. Флаг выключал встроенный в AGP 9 Kotlin,
#     а отдельный плагин org.jetbrains.kotlin.android из проекта
#     убран. В таком сочетании Kotlin-код компилировать некому,
#     и сборка может пройти, а приложение — упасть при запуске
#     без своих классов. Со встроенным Kotlin всё на месте.

# ── Убран: R8 сокращает ресурсы по-новому ────────────────────────────────
#
# android.r8.optimizedResourceShrinking=false
#     Новое сокращение ресурсов вместе с кодом — ровно то, что
#     рекомендует консоль Google Play («оптимизируйте R8»). Размер
#     сборки меньше. ⚠️ Проверить релизную сборку на устройстве:
#     если где-то пропадёт картинка или строка, её забрали по ошибке —
#     тогда вернуть флаг и прислать мне, какой ресурс пропал.

# ── Оставлен временно: старый API вариантов ──────────────────────────────
#
# Кто-то в сборке обращается к устаревшему applicationVariants — скорее
# всего плагин Baseline Profile 1.3.3: он проверен только до AGP
# 9.0-alpha01. Без этого флага сборка упала бы.
#
# Найти, кто именно:
#     ./gradlew help -Pandroid.debug.obsoleteApi=true
android.newDsl=false

# ── Добавлен: ускоряет импорт проекта в Android Studio ───────────────────
# Прежнее имя (excludeLibraryComponentsFromConstraints) AGP 9.3 сам
# объявил устаревшим и предложил это — так и сделано
android.dependency.useConstraints=false
