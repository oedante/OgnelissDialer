[versions]
agp = "9.4.1"  # 1.3.3: было 9.3.1 — фаза «Новые инструменты», шаг 1
kotlin = "2.4.20"  # 1.3.3 шаг 2: было 2.2.10
ksp = "2.3.12"     # 1.3.3 шаг 2: было 2.3.6
hilt = "2.60.1"    # 1.3.3 шаг 2: было 2.59.2; Hilt должен читать метаданные Kotlin 2.4
composeBom = "2024.12.01"

# Версия Compose, соответствующая BOM выше.
#
# ── Зачем дублировать её вручную ──────────────────────────────────────
# BOM задаёт версии для зависимостей, объявленных БЕЗ версии, но только
# как «рекомендацию»: если другая библиотека потребует версию выше,
# Gradle возьмёт высшую — таково правило разрешения конфликтов.
#
# Так в сборку и попал Compose 1.12.0, требующий AGP 9.1 и compileSdk 37,
# тогда как у проекта тогда был AGP 8.7.3 и compileSdk 35. С AGP 9.3.1
# преграда осталась одна — compileSdk 37 (у нас 36).
#
# Явная версия у инструментов разработчика закрывает эту лазейку:
# она указана прямо, и поднять её транзитивной зависимостью нельзя.
#
# ⚠️ При смене composeBom поменяйте и это значение. Соответствие
# смотреть здесь: developer.android.com/develop/ui/compose/bom/bom-mapping
composeUi = "1.7.6"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigation = "2.8.5"
# Положение раскладушки («книга», «ноутбук») и границы сгиба.
# Размер окна берётся из самой Compose, для него библиотека не нужна.
window = "1.3.0"
datastore = "1.1.1"
# Room 2.8, а не 2.6: KSP 2.3 работает только в режиме KSP2, а Room 2.6
# под KSP2 падает на кодогенерации — «unexpected jvm signature V»
# (так и упала первая сборка на AGP 9.3.1). Поддержку KSP2 Room довёл
# в ветке 2.7; 2.8.5 — последняя стабильная на сентябрь 2026.
# Требует minSdk 23 — у нас 26
room = "2.8.5"
coil = "2.7.0"
libphonenumber = "8.13.52"
# Генерация QR-кодов. Чисто вычислительная библиотека без обращений
# к сети: приложение по-прежнему не имеет разрешения на интернет
zxing = "3.5.3"
accompanistPermissions = "0.36.0"

benchmark = "1.3.3"
uiautomator = "2.3.0"
baselineprofile = "1.3.3"

[libraries]
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.6.1" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.0.1" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
libphonenumber-geocoder = { module = "com.googlecode.libphonenumber:geocoder", version = "3.5" }
# Оператор по номеру за пределами России. Для России НЕ используется —
# разбор в NumberInfoRepository рядом с carrierMapper
libphonenumber-carrier = { module = "com.googlecode.libphonenumber:carrier", version = "1.226" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.10.0" }
hilt-work = { module = "androidx.hilt:hilt-work", version = "1.2.0" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version = "1.2.0" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
